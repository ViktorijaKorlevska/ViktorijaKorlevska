name: Deploy Backend Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd
          aws-region: us-east-1

      - name: Deploy CDK Stack
        run: |
          cd backend
          npx cdk deploy viktorija-portfolio --require-approval never
        env:
          GITHUB_TOKEN: ${{ secrets.SANITY_GHA_TOKEN }}
          SANITY_WEBHOOK_SECRET: ${{ secrets.SANITY_WEBHOOK_SECRET }}
          GITHUB_OWNER: ViktorijaKorlevska
          GITHUB_REPO: ViktorijaKorlevska
          GITHUB_WORKFLOW: "deploy-client.yml"
